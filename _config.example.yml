# Copy this file to `_config.yml` and customize it.
# `_config.yml` is intentionally ignored by git.

# Search
search: 
  enable: true
  service: hexo # google/hexo/algolia/azure/baidu
  # google 
  google_api_key:
  google_engine_id:
  # algolia
  algolia_app_id:
  algolia_api_key:
  algolia_index_name:
  # azure
  azure_service_name:
  azure_index_name:
  azure_query_key:
  # baidu
  baidu_api_id:

# navigation menu
menu:
  - name: Home
    slug: home
    url: /
  - name: Archives
    slug: archives
    url: /archives
  - name: Categories
    slug: categories
    url: /categories
  - name: Friends
    slug: link
    url: /link
  - name: About
    slug: about
    url: /about

# widgets
widgets:
  - about
  - categories
  - tagcloud

# Theme color (default: pink)
# Both `theme_color` and `theme-color` are accepted.
theme_color: '#e91e63'

# Page background image
# Leave empty to keep the default background color.
# Supports local paths (/img/bg.jpg) and absolute URLs.
# Both `background_url` and `background-url` are accepted.
background_url: ''

# Comments
# Only one provider is enabled at a time.
# type: twikoo | waline | giscus | artalk (leave empty to disable)
comments:
  type: ''

  twikoo:
    envId: ''
    lang: zh-CN

  waline:
    serverURL: ''
    lang: zh-CN

  giscus:
    repo: ''
    repoId: ''
    category: ''
    categoryId: ''
    mapping: pathname
    strict: '0'
    reactionsEnabled: '1'
    inputPosition: top
    lang: zh-CN
    theme: preferred_color_scheme

  artalk:
    server: ''
    site: ''

# Advanced settings
advanced:
  cdn:
    # local | jsdelivr | unpkg | custom
    type: 'local'
    # jsDelivr: GitHub repo (user/repo) or npm package
    # The repo/package should contain the generated public assets.
    repo: ''
    package: ''
    # Branch / tag / version. Required for jsDelivr, optional for unpkg.
    version: ''
    # Path prefix inside the repo/package, e.g. '' or 'public'
    path: ''
    # Custom CDN base URL, used when type is custom (no trailing slash)
    url: ''

# Less
less:
  compress: true

# use url, not username
social:
- slug: github
  url: https://github.com/stkevintan
- slug: twitter
  url: https://twitter.com/kevinsfork
- slug: rss
	url: /atom.xml
