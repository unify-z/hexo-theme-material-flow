# Copy this file to `_config.yml` and customize it.
# `_config.yml` is intentionally ignored by git.

# Search
search: 
  enable: true
  service: hexo # google/hexo/algolia/azure/baidu
  # google 
  google_api_key:
  google_engine_id:
  # algolia
  algolia_app_id:
  algolia_api_key:
  algolia_index_name:
  # azure
  azure_service_name:
  azure_index_name:
  azure_query_key:
  # baidu
  baidu_api_id:

# navigation menu
menu:
  - name: Home
    slug: home
    url: /
  - name: Archives
    slug: archives
    url: /archives
  - name: Categories
    slug: categories
    url: /categories
  - name: Friends
    slug: link
    url: /link
  - name: About
    slug: about
    url: /about

# widgets
widgets:
  - about
  - categories
  - tagcloud

# About widget
about:
  desc: 'Tempora mutantur, nos et mutamur in illis ...'

# Blogger avatar (empty to use root config.avatar)
avatar: '/avatar/avatar.png'

# Page icon / favicon (empty to use root config.favicon)
favicon: '/avatar/favicon-round.png'

# Round the blogger avatar
rounded: true

# Theme color (default: pink)
# Both `theme_color` and `theme-color` are accepted.
theme_color: '#e91e63'

# Page background image
# Leave empty to keep the default background color.
# Supports local paths (/img/bg.jpg) and absolute URLs.
# Both `background_url` and `background-url` are accepted.
background_url: ''

# Comments
# Only one provider is enabled at a time.
# type: twikoo | waline | giscus | artalk (leave empty to disable)
comments:
  type: ''

  twikoo:
    envId: ''
    lang: zh-CN
    # custom CDN: full URL to twikoo.min.js; ignored for jsdelivr/unpkg
    src: ''

  waline:
    serverURL: ''
    lang: zh-CN
    # custom CDN: full URLs; ignored for jsdelivr/unpkg
    js: ''
    css: ''

  giscus:
    repo: ''
    repoId: ''
    category: ''
    categoryId: ''
    mapping: pathname
    strict: '0'
    reactionsEnabled: '1'
    inputPosition: top
    lang: zh-CN
    theme: preferred_color_scheme

  artalk:
    server: ''
    site: ''
    # custom CDN: full URLs; ignored for jsdelivr/unpkg
    js: ''
    css: ''

# Advanced settings
advanced:
  cdn:
    # local | jsdelivr | unpkg | custom
    type: 'local'
    # jsDelivr: GitHub repo (user/repo) or npm package
    # The repo/package should contain the generated public assets.
    repo: ''
    package: ''
    # Branch / tag / version. Required for jsDelivr, optional for unpkg.
    version: ''
    # Path prefix inside the repo/package, e.g. '' or 'public'
    path: ''
    # CDN base URL / mirror, no trailing slash.
    # Optional for jsdelivr/unpkg (system defaults are used).
    # Required for custom.
    baseUrl: ''

# PJAX
# Navigate between pages without a full page reload.
pjax:
  # Set to false to disable PJAX.
  enable: true
  # PJAX script URL.
  # Leave empty to generate it from `advanced.cdn.type`:
  #   local    -> /js/pjax.min.js (bundled with the theme)
  #   jsdelivr -> https://cdn.jsdelivr.net/npm/pjax@0.2.8/pjax.min.js
  #   unpkg    -> https://unpkg.com/pjax@0.2.8/pjax.min.js
  #   custom   -> REQUIRED; no URL can be generated automatically
  # Set a full URL here to override the generated value.
  script: ''

# Less
less:
  compress: true

# use url, not username
social:
- slug: github
  url: https://github.com/stkevintan
- slug: twitter
  url: https://twitter.com/kevinsfork
- slug: rss
	url: /atom.xml
