# Copy this file to `_config.yml` and customize it.
# `_config.yml` is intentionally ignored by git.

# Search
search: 
  enable: true
  service: hexo # google/hexo/algolia/azure/baidu
  # google 
  google_api_key:
  google_engine_id:
  # algolia
  algolia_app_id:
  algolia_api_key:
  algolia_index_name:
  # azure
  azure_service_name:
  azure_index_name:
  azure_query_key:
  # baidu
  baidu_api_id:

# navigation menu
menu:
  - name: Home
    slug: home
    url: /
  - name: Archives
    slug: archives
    url: /archives
  - name: Categories
    slug: categories
    url: /categories
  - name: Friends
    slug: link
    url: /link
  - name: About
    slug: about
    url: /about

# widgets
widgets:
  - about
  - categories
  - tagcloud

# Page background image
# Leave empty to keep the default background color.
# Supports local paths (/img/bg.jpg) and absolute URLs.
# Both `background_url` and `background-url` are accepted.
background_url: ''

# Less
less:
  compress: true

# use url, not username
social:
- slug: github
  url: https://github.com/stkevintan
- slug: twitter
  url: https://twitter.com/kevinsfork
- slug: rss
	url: /atom.xml
